[Unit]
Requires=walnuts-pilot-guard.service
After=walnuts-pilot-guard.service

[Service]
# Reconcile the guard on every tailscaled start/restart, even when the oneshot
# guard unit was already active. Failure prevents tailscaled from starting.
ExecStartPre=/usr/bin/env PYTHONPATH=/opt/walnuts/src /usr/bin/python3 -m walnuts.cli server-guard /etc/walnuts/pilot.toml
