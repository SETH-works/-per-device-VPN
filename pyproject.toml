[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sethlinux-walnuts"
version = "0.1.0"
description = "Safe, provider-neutral control-plane primitives for Project Walnuts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
walnuts = "walnuts.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

